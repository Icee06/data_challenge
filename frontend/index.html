<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom CQA Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex flex-wrap gap-3 justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="h-8 w-8 bg-emerald-500 rounded flex items-center justify-center font-bold text-slate-950">F</div>
      <h1 class="text-xl font-bold">Freedom Broker <span class="text-emerald-400">CQA System</span></h1>
    </div>
    <div class="flex flex-wrap gap-2 items-center">
      <select id="filter-lang" class="bg-slate-700 text-sm rounded px-3 py-1.5 border border-slate-600">
        <option value="ALL">All languages</option>
        <option value="RU">Russian</option><option value="KZ">Kazakh</option><option value="EN">English</option>
      </select>
      <select id="filter-type" class="bg-slate-700 text-sm rounded px-3 py-1.5 border border-slate-600">
        <option value="ALL">All types</option>
        <option value="chat">Chat</option><option value="call">Call</option>
      </select>
      <button id="btn-reviewer" class="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-1.5 rounded border border-slate-600">
        Reviewer queue <span id="appeal-count" class="ml-1 px-1.5 rounded bg-amber-500 text-slate-900 text-xs font-bold">0</span>
      </button>
      <button id="btn-edit-checklist" class="bg-indigo-600 hover:bg-indigo-500 text-sm px-3 py-1.5 rounded">Edit checklist</button>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">
    <!-- Dialog list -->
    <section class="col-span-3 bg-slate-800 rounded-lg border border-slate-700 flex flex-col min-h-0">
      <div class="p-3 border-b border-slate-700 text-sm text-slate-400 flex justify-between items-center">
        <span>Dialogs (<span id="dialog-count">0</span>)</span>
        <label class="cursor-pointer text-emerald-400 hover:underline text-xs">Upload JSON
          <input id="upload" type="file" accept=".json" class="hidden">
        </label>
      </div>
      <div id="dialog-list" class="flex-1 overflow-y-auto"></div>
      <div id="source-note" class="px-3 py-2 text-[10px] text-slate-500 border-t border-slate-700"></div>
    </section>

    <!-- Transcript -->
    <section class="col-span-5 bg-slate-800 rounded-lg border border-slate-700 flex flex-col min-h-0">
      <div class="p-3 border-b border-slate-700 flex justify-between items-center gap-2">
        <div id="dialog-title" class="text-sm font-semibold truncate">No dialog selected</div>
        <button id="btn-run" disabled class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-xs font-semibold px-3 py-1.5 rounded whitespace-nowrap">Run evaluation</button>
      </div>
      <div id="audio-container" class="hidden p-3 bg-slate-900 border-b border-slate-700">
        <span class="text-xs text-slate-400 block mb-1">Audio recording</span>
        <audio id="audio-player" controls class="w-full h-10"></audio>
      </div>
      <div id="transcript-container" class="flex-1 p-4 overflow-y-auto space-y-3">
        <p class="text-slate-500 text-center py-10">Select a dialog to view the transcript.</p>
      </div>
    </section>

    <!-- Evaluation -->
    <section class="col-span-4 bg-slate-800 rounded-lg border border-slate-700 flex flex-col min-h-0">
      <div class="p-4 bg-slate-900 border-b border-slate-700">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-400 block">AI quality score</span>
            <div class="flex items-baseline gap-2">
              <span id="score-value" class="text-3xl font-black text-emerald-400">--</span>
              <span class="text-slate-500 text-sm">/ 100</span>
            </div>
            <div id="score-trail" class="text-xs text-slate-400 mt-1"></div>
          </div>
          <div id="critical-badge" class="hidden px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded text-xs font-semibold">Critical error</div>
        </div>
        <div id="section-scores" class="flex flex-wrap gap-2 mt-3"></div>
      </div>
      <div id="criteria-container" class="flex-1 p-4 overflow-y-auto space-y-3">
        <p class="text-slate-500 text-center py-10">Select a dialog, then run the evaluation.</p>
      </div>
      <div class="p-3 bg-slate-900 border-t border-slate-700">
        <button id="btn-appeal" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold py-2 rounded">Dispute a criterion</button>
      </div>
    </section>
  </main>

  <!-- Appeal modal -->
  <div id="modal-appeal" class="modal hidden">
    <div class="modal-box max-w-md">
      <h3 class="text-lg font-bold mb-4">Dispute a criterion</h3>
      <label class="block text-xs text-slate-400 mb-1">Criterion</label>
      <select id="appeal-crit" class="w-full bg-slate-700 rounded border border-slate-600 p-2 text-sm mb-4"></select>
      <label class="block text-xs text-slate-400 mb-1">Comment</label>
      <textarea id="appeal-comment" class="w-full bg-slate-700 rounded border border-slate-600 p-2 text-sm h-24 mb-1" placeholder="Explain why the AI evaluation is inaccurate"></textarea>
      <p id="appeal-error" class="text-red-400 text-xs h-4 mb-2"></p>
      <div class="flex justify-end gap-2">
        <button data-close="modal-appeal" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded">Cancel</button>
        <button id="btn-submit-appeal" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold rounded">Submit appeal</button>
      </div>
    </div>
  </div>

  <!-- Reviewer modal -->
  <div id="modal-review" class="modal hidden">
    <div class="modal-box max-w-3xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">Reviewer queue</h3>
        <button data-close="modal-review" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>
      <div id="review-list" class="overflow-y-auto space-y-4 pr-1"></div>
    </div>
  </div>

  <!-- Checklist modal -->
  <div id="modal-checklist" class="modal hidden">
    <div class="modal-box max-w-5xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-lg font-bold">Checklist settings</h3>
        <button data-close="modal-checklist" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>
      <div id="checklist-rows" class="overflow-y-auto space-y-3 pr-1"></div>
      <div class="flex flex-wrap justify-between items-center gap-2 mt-4">
        <div class="flex items-center gap-3">
          <button id="btn-add-crit" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded">Add criterion</button>
          <button id="btn-reset-crit" class="px-3 py-2 text-slate-400 hover:text-white text-xs">Reset to PDF default</button>
          <span id="weight-sum" class="text-xs"></span>
        </div>
        <div class="flex items-center gap-2">
          <span id="checklist-error" class="text-red-400 text-xs"></span>
          <button data-close="modal-checklist" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs font-semibold rounded">Cancel</button>
          <button id="btn-save-checklist" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold rounded">Save and re-evaluate</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
